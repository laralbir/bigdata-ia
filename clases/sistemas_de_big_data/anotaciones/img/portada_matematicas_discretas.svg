<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="1600" height="2400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Fondo con gradiente profundo de alta tecnología -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="35%" stop-color="#0c182c"/>
      <stop offset="70%" stop-color="#10223b"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>

    <!-- Gradiente de acento principal (Cian -> Azul -> Violeta) -->
    <linearGradient id="accent-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="35%" stop-color="#00b4d8"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Gradiente para el texto del título -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Gradientes para conjuntos de Venn -->
    <radialGradient id="setA-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#00b4d8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"/>
    </radialGradient>

    <radialGradient id="setB-grad" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.0"/>
    </radialGradient>

    <radialGradient id="intersection-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Gradiente para tarjeta de código -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f213a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Patrón de malla discreta de fondo -->
    <pattern id="math-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.18"/>
      <path d="M 40 36 L 40 44 M 36 40 L 44 40" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.1"/>
    </pattern>

    <!-- Marcadores de flechas para grafos y digrafos -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00f5d4"/>
    </marker>
  </defs>

  <!-- ==================== FONDO ==================== -->
  <rect width="1600" height="2400" fill="url(#bg-gradient)"/>
  <rect width="1600" height="2400" fill="url(#math-grid)"/>

  <!-- Barra superior de acento neón -->
  <rect x="0" y="0" width="1600" height="16" fill="url(#accent-primary)"/>

  <!-- ==================== ENCABEZADO / BADGES ==================== -->
  <!-- Cápsula institucional superior -->
  <g transform="translate(800, 150)">
    <rect x="-350" y="-28" width="700" height="56" rx="28" fill="#0f2340" stroke="#00b4d8" stroke-width="1.8" stroke-opacity="0.6"/>
    <circle cx="-315" cy="0" r="7" fill="#00f5d4"/>
    <text x="15" y="8" text-anchor="middle" font-size="21" font-weight="700" fill="#e2e8f0" letter-spacing="3.5">
      SISTEMAS DE BIG DATA · ESPECIALIZACIÓN IA
    </text>
  </g>

  <!-- Supertítulo -->
  <text x="800" y="275" text-anchor="middle" font-size="26" font-weight="600" fill="#94a3b8" letter-spacing="6">
    FUNDAMENTOS MATEMÁTICOS PARA COMPUTACIÓN DISTRIBUIDA
  </text>

  <!-- ==================== BLOQUE DEL TÍTULO ==================== -->
  <text x="800" y="390" text-anchor="middle" font-size="94" font-weight="900" fill="#ffffff" letter-spacing="2">
    MATEMÁTICAS
  </text>
  <text x="800" y="495" text-anchor="middle" font-size="94" font-weight="900" fill="url(#title-gradient)" letter-spacing="2">
    DISCRETAS
  </text>

  <text x="800" y="575" text-anchor="middle" font-size="38" font-weight="700" fill="#38bdf8" letter-spacing="4">
    Y FUNDAMENTOS COMPUTACIONALES
  </text>

  <!-- Divisor con gradiente neón -->
  <rect x="420" y="620" width="760" height="5" rx="2.5" fill="url(#accent-primary)"/>

  <!-- Etiquetas Temáticas Clave (Pills) -->
  <g transform="translate(800, 680)">
    <!-- Pill 1: Conjuntos -->
    <rect x="-620" y="-20" width="220" height="40" rx="20" fill="#0c1d33" stroke="#00f5d4" stroke-width="1.4" stroke-opacity="0.5"/>
    <text x="-510" y="7" text-anchor="middle" font-size="18" font-weight="600" fill="#a7f3d0">Teoría de Conjuntos</text>

    <!-- Pill 2: Relaciones -->
    <rect x="-370" y="-20" width="230" height="40" rx="20" fill="#0c1d33" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.5"/>
    <text x="-255" y="7" text-anchor="middle" font-size="18" font-weight="600" fill="#bae6fd">Relaciones &amp; Digrafos</text>

    <!-- Pill 3: Funciones -->
    <rect x="-110" y="-20" width="220" height="40" rx="20" fill="#0c1d33" stroke="#818cf8" stroke-width="1.4" stroke-opacity="0.5"/>
    <text x="0" y="7" text-anchor="middle" font-size="18" font-weight="600" fill="#c7d2fe">Mapeo &amp; Sharding</text>

    <!-- Pill 4: Lógica Formal -->
    <rect x="140" y="-20" width="220" height="40" rx="20" fill="#0c1d33" stroke="#c084fc" stroke-width="1.4" stroke-opacity="0.5"/>
    <text x="250" y="7" text-anchor="middle" font-size="18" font-weight="600" fill="#e9d5ff">Lógica Proposicional</text>

    <!-- Pill 5: Inferencia -->
    <rect x="390" y="-20" width="230" height="40" rx="20" fill="#0c1d33" stroke="#f472b6" stroke-width="1.4" stroke-opacity="0.5"/>
    <text x="505" y="7" text-anchor="middle" font-size="18" font-weight="600" fill="#fbcfe8">Inferencia Deductiva</text>
  </g>

  <!-- ==================== CENTRO: ILUSTRACIÓN VECTORIAL MATEMÁTICA ==================== -->
  <g transform="translate(180, 755)">
    <!-- Marco contenedor de la composición matemática -->
    <rect x="0" y="0" width="1240" height="630" rx="24" fill="#091424" fill-opacity="0.85" stroke="#1e3a5f" stroke-width="2"/>

    <!-- Cabecera de la sección gráfica -->
    <text x="40" y="48" font-size="20" font-weight="700" fill="#64748b" letter-spacing="2">
      ESTRUCTURAS DISCRETAS Y MODELADO FORMAL
    </text>

    <!-- ================= SUB-PANEL 1: TEORÍA DE CONJUNTOS (VENN) ================= -->
    <g transform="translate(40, 70)">
      <!-- Marco del Universo U -->
      <rect x="0" y="0" width="560" height="480" rx="16" fill="#060d18" stroke="#1e3a5f" stroke-dasharray="6,6" stroke-width="1.5"/>
      <text x="25" y="36" font-size="20" font-weight="700" fill="#38bdf8">Universo U (Dataset Global)</text>
      <text x="535" y="36" text-anchor="end" font-size="14" font-weight="600" fill="#64748b">(A ∪ B)ᶜ (Complemento)</text>

      <!-- Conjunto A (Cian) -->
      <circle cx="210" cy="245" r="150" fill="url(#setA-grad)" stroke="#00f5d4" stroke-width="3"/>
      
      <!-- Conjunto B (Violeta) -->
      <circle cx="350" cy="245" r="150" fill="url(#setB-grad)" stroke="#c084fc" stroke-width="3"/>

      <!-- Resplandor Intersección A ∩ B -->
      <ellipse cx="280" cy="245" rx="60" ry="105" fill="url(#intersection-glow)"/>

      <!-- Etiquetas en el Diagrama -->
      <text x="140" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#00f5d4">A</text>
      <text x="140" y="268" text-anchor="middle" font-size="16" font-weight="600" fill="#94a3b8">Solo en A (A ∖ B)</text>

      <text x="420" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#c084fc">B</text>
      <text x="420" y="268" text-anchor="middle" font-size="16" font-weight="600" fill="#94a3b8">Solo en B (B ∖ A)</text>

      <text x="280" y="235" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">A ∩ B</text>
      <text x="280" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#e0f2fe">Intersección</text>

      <!-- Barra de fórmulas en la base de Venn -->
      <g transform="translate(20, 420)">
        <rect x="0" y="0" width="520" height="44" rx="10" fill="#0b1728" stroke="#1e293b" stroke-width="1"/>
        <text x="260" y="28" text-anchor="middle" font-size="16" font-family="Menlo, Consolas, monospace" fill="#7dd3fc">
          A ∪ B = {x | x ∈ A ∨ x ∈ B}  ·  P(A) ∩ P(B) = ∅
        </text>
      </g>
    </g>

    <!-- ================= SUB-PANEL 2: GRAFO DIRIGIDO & LÓGICA ================= -->
    <g transform="translate(640, 70)">
      <rect x="0" y="0" width="560" height="480" rx="16" fill="#060d18" stroke="#1e3a5f" stroke-width="1.5"/>
      <!-- Título del sub-panel -->
      <text x="25" y="36" font-size="20" font-weight="700" fill="#a78bfa">Relaciones Binarias, Digrafos &amp; DAGs</text>

      <!-- Conexiones / Aristas Dirigidas -->
      <!-- v1 -> v2 -->
      <line x1="130" y1="155" x2="305" y2="125" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="205" y="120" font-size="14" font-family="Menlo, monospace" fill="#38bdf8">a R b</text>

      <!-- v2 -> v3 -->
      <line x1="365" y1="145" x2="440" y2="240" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="430" y="180" font-size="14" font-family="Menlo, monospace" fill="#38bdf8">b R c</text>

      <!-- Atajo transitivo v1 -> v3 (Curva violeta con cápsula protectora de texto) -->
      <path d="M 125 185 Q 260 270 425 275" fill="none" stroke="#c084fc" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-violet)"/>
      <g transform="translate(255, 272)">
        <rect x="-95" y="-14" width="190" height="26" rx="6" fill="#060d18" stroke="#c084fc" stroke-width="1.2"/>
        <text x="0" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#f5d0fe">Transitividad: a R c</text>
      </g>

      <!-- v1 -> v4 -->
      <line x1="110" y1="190" x2="190" y2="330" stroke="#00f5d4" stroke-width="2.5" marker-end="url(#arrow-green)"/>
      <text x="125" y="270" font-size="13" font-family="Menlo, monospace" fill="#00f5d4">a R d</text>

      <!-- Bucle reflexivo en v4 (auto-relación d R d) -->
      <path d="M 180 342 C 120 330 120 375 180 362" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="130" y="390" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#7dd3fc">Reflexiva (d, d)</text>

      <!-- Nodos del Grafo -->
      <!-- Nodo v1 -->
      <g transform="translate(100, 160)">
        <circle r="32" fill="#0f2744" stroke="#00f5d4" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">v₁</text>
      </g>

      <!-- Nodo v2 -->
      <g transform="translate(340, 120)">
        <circle r="32" fill="#0f2744" stroke="#38bdf8" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">v₂</text>
      </g>

      <!-- Nodo v3 -->
      <g transform="translate(460, 270)">
        <circle r="32" fill="#201540" stroke="#c084fc" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">v₃</text>
      </g>

      <!-- Nodo v4 -->
      <g transform="translate(210, 350)">
        <circle r="32" fill="#0f2744" stroke="#38bdf8" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">v₄</text>
      </g>

      <!-- Tarjeta inferior de Reglas Lógicas -->
      <g transform="translate(20, 400)">
        <rect x="0" y="0" width="520" height="64" rx="10" fill="#0b1728" stroke="#1e293b" stroke-width="1"/>
        <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">
          Inferencia: Modus Ponens [(P → Q) ∧ P] ⇒ Q
        </text>
        <text x="260" y="50" text-anchor="middle" font-size="14" font-family="Menlo, monospace" fill="#38bdf8">
          ∀x P(x) ≡ ¬∃x ¬P(x)   ·   f: Dominio → Codominio
        </text>
      </g>
    </g>
  </g>

  <!-- ==================== CÓDIGO PYTHON / CASO DE USO DISTRIBUIDO ==================== -->
  <g transform="translate(180, 1420)">
    <!-- Ventana estilo Terminal/IDE -->
    <rect x="0" y="0" width="1240" height="520" rx="20" fill="url(#card-grad)" stroke="#1e3a5f" stroke-width="2"/>
    
    <!-- Barra superior de la ventana -->
    <rect x="0" y="0" width="1240" height="56" rx="20" fill="#0d1b30"/>
    <rect x="0" y="36" width="1240" height="20" fill="#0d1b30"/>
    
    <!-- Botones macOS -->
    <circle cx="36" cy="28" r="9" fill="#ef4444"/>
    <circle cx="68" cy="28" r="9" fill="#eab308"/>
    <circle cx="100" cy="28" r="9" fill="#22c55e"/>

    <!-- Título de la pestaña -->
    <text x="620" y="35" text-anchor="middle" font-size="18" font-family="Menlo, Consolas, monospace" fill="#94a3b8">
      matematicas_discretas_big_data.py — Python 3 &amp; PySpark Engine
    </text>

    <!-- Código fuente con resaltado de sintaxis -->
    <g transform="translate(48, 105)" font-family="Menlo, Monaco, Consolas, monospace" font-size="22" xml:space="preserve">
      <!-- Línea 1 -->
      <text y="0"><tspan fill="#64748b"># 1. Particionado de Conjuntos Disjuntos en Clúster (Sharding)</tspan></text>
      
      <!-- Línea 2 -->
      <text y="42"><tspan fill="#f43f5e">def</tspan> <tspan fill="#38bdf8">particionar_dataset</tspan><tspan fill="#f8fafc">(universo_U: set, num_workers: int = 3):</tspan></text>
      
      <!-- Línea 3 -->
      <text y="84"><tspan fill="#f8fafc">    h_map = {reg: </tspan><tspan fill="#c084fc">hash</tspan><tspan fill="#f8fafc">(reg) % num_workers </tspan><tspan fill="#f43f5e">for</tspan><tspan fill="#f8fafc"> reg </tspan><tspan fill="#f43f5e">in</tspan><tspan fill="#f8fafc"> universo_U}</tspan></text>
      
      <!-- Línea 4 -->
      <text y="126"><tspan fill="#64748b">    # Cobertura total: ⋃ Pᵢ = U  y  Disjunción estricta: Pᵢ ∩ Pⱼ = ∅</tspan></text>
      
      <!-- Línea 5 -->
      <text y="168"><tspan fill="#f43f5e">    return</tspan><tspan fill="#f8fafc"> [set(k </tspan><tspan fill="#f43f5e">for</tspan><tspan fill="#f8fafc"> k, w </tspan><tspan fill="#f43f5e">in</tspan><tspan fill="#f8fafc"> h_map.items() </tspan><tspan fill="#f43f5e">if</tspan><tspan fill="#f8fafc"> w == i) </tspan><tspan fill="#f43f5e">for</tspan><tspan fill="#f8fafc"> i </tspan><tspan fill="#f43f5e">in</tspan><tspan fill="#c084fc"> range</tspan><tspan fill="#f8fafc">(num_workers)]</tspan></text>

      <!-- Línea 6 -->
      <text y="225"><tspan fill="#64748b"># 2. Inferencia Lógica Deductiva (Modus Ponens en Calidad de Datos)</tspan></text>

      <!-- Línea 7 -->
      <text y="267"><tspan fill="#38bdf8">regla_implicacion</tspan> <tspan fill="#f8fafc">= (</tspan><tspan fill="#a7f3d0">"Volumen &gt; 1TB"</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#a7f3d0">"Activar_Particionado"</tspan><tspan fill="#f8fafc">)</tspan></text>

      <!-- Línea 8 -->
      <text y="309"><tspan fill="#f43f5e">if</tspan> <tspan fill="#f8fafc">volumen_actual &gt; 1.0: </tspan><tspan fill="#64748b"># Premisa P constatada Verdadera</tspan></text>

      <!-- Línea 9 -->
      <text y="351"><tspan fill="#f8fafc">    accion = motor.aplicar_modus_ponens(regla_implicacion) </tspan><tspan fill="#22c55e"># Conclusión Q: True</tspan></text>
    </g>
  </g>

  <!-- ==================== PIE DE PÁGINA INSTITUCIONAL ==================== -->
  <g transform="translate(800, 2080)">
    <!-- Línea decorativa -->
    <line x1="-300" y1="0" x2="300" y2="0" stroke="#1e3a5f" stroke-width="1.5"/>

    <!-- Titulación oficial -->
    <text x="0" y="50" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="2.5">
      CURSO DE ESPECIALIZACIÓN EN IA Y BIG DATA
    </text>

    <!-- Subtítulo formativo -->
    <text x="0" y="95" text-anchor="middle" font-size="24" font-weight="600" fill="#38bdf8" letter-spacing="3">
      FORMACIÓN PROFESIONAL · CURSO 2026/2027
    </text>

    <!-- Metadatos de la clase -->
    <text x="0" y="140" text-anchor="middle" font-size="20" fill="#94a3b8">
      Módulo: Sistemas de Big Data · 📅 2026-10-05 · Ref: 2026-10-05 - SBD Conceptos Basicos.docx
    </text>

    <text x="0" y="175" text-anchor="middle" font-size="16" fill="#64748b" letter-spacing="1.5">
      EDICIÓN OFICIAL EPUB · TEORÍA, FORMALIZACIÓN Y CASOS PRÁCTICOS EN PYTHON
    </text>
  </g>

  <!-- Barra inferior de acento neón -->
  <rect x="0" y="2384" width="1600" height="16" fill="url(#accent-primary)"/>
</svg>
