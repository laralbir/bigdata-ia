<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Máster Big Data & IA</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Campus Virtual y Repositorio del Máster en Big Data e IA">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  
  <style>
    :root {
      --theme-color: #4f46e5;
      --base-font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --base-font-size: 16px;
      --base-line-height: 1.6;
      --code-font-family: 'JetBrains Mono', monospace;
      
      --sidebar-width: 300px;
      --sidebar-background: #ffffff;
      --sidebar-border-color: #f3f4f6;
      --sidebar-nav-link-color--active: var(--theme-color);
      --sidebar-nav-link-font-weight--active: 600;
      
      --cover-background-color: #ffffff;
      --cover-background-image: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
      --cover-heading-color: #111827;
      --cover-button-background--primary: var(--theme-color);
      --cover-button-color--primary: #ffffff;
      --cover-button-border: 0;
      
      --blockquote-border-color: var(--theme-color);
      --blockquote-background: #eff6ff;
      --blockquote-color: #1e40af;
    }
    
    .btn-primary {
      display: inline-block;
      background: var(--theme-color);
      color: white !important;
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
      transition: transform 0.2s;
      margin: 1rem 0;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      text-decoration: none;
    }
    
    .cover-main h1 {
      background: -webkit-linear-gradient(45deg, #4f46e5, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 3.5rem;
    }
  
    .mermaid {
      display: flex;
      justify-content: center;
      margin: 2rem 0;
    }

    /* Aprovechar mejor el ancho de la pantalla */
    :root {
      --content-max-width: 90em;
    }
    
    .markdown-section {
      max-width: 95%;
    }
    
    /* Ocultar iconos dobles del menú lateral */
    .sidebar-nav li:has(> ul) > a::before,
    .sidebar-nav li:has(> ul) > p::before {
      display: none !important;
      background: none !important;
    }
</style>
</head>
<body>
  <div id="app">Cargando el Campus Virtual...</div>
  <script>
    // Corrección para enlaces con "Copy Link to Highlight" de Chrome (:~:text=)
    // Docsify intenta leerlos como parte de la ruta del archivo y lanza 404.
    if (window.location.hash.includes(':~:text=')) {
      window.location.hash = window.location.hash.split(':~:text=')[0];
    }
    
    window.$docsify = {
      name: '🎓 Campus Big Data',
      repo: 'laralbir/bigdata-ia',
      loadSidebar: true,
      coverpage: false,
      sidebarDisplayLevel: 1, // Collapse sidebar sub-menus by default
      
      subMaxLevel: 0,
      auto2top: true,
      themeColor: '#4f46e5',
      search: {
        placeholder: '🔍 Buscar material...',
        noData: 'No se encontraron resultados',
        depth: 3
      },
      copyCode: {
        buttonText : 'Copiar',
        errorText  : 'Error',
        successText: 'Copiado!'
      },
      pagination: {
        previousText: 'Anterior',
        nextText: 'Siguiente',
        crossChapter: true,
        crossChapterText: true
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(html) {
             if (window.slideshowKeydownHandler) {
                 document.removeEventListener('keydown', window.slideshowKeydownHandler);
                 window.slideshowKeydownHandler = null;
             }
             return html;
          });
          
          hook.doneEach(function() {
            // Mermaid initialization
            if (window.mermaid) {
              window.mermaid.run({ querySelector: '.mermaid' }).catch(function(e) {
                console.error('Mermaid render error', e);
              });
            }
            
            // Slideshow Logic for presentation pages
            const content = document.querySelector('.markdown-section');
            if (!content) return;
            
            const h1 = content.querySelector('h1');
            if (h1 && h1.textContent.toLowerCase().includes('diapositivas')) {
              // Find all images that are direct children of paragraphs
              const images = Array.from(content.querySelectorAll('p > img'));
              if (images.length > 1) {
                let currentIndex = 0;
                
                const navContainer = document.createElement('div');
                navContainer.className = 'slideshow-controls';
                navContainer.innerHTML = `
                  <button id="slide-prev" class="btn-primary" style="margin-right: 10px; cursor: pointer;">⬅ Anterior</button>
                  <span id="slide-counter" style="font-weight: 600; margin: 0 15px; font-family: var(--code-font-family);">1 / ${images.length}</span>
                  <button id="slide-next" class="btn-primary" style="cursor: pointer;">Siguiente ➡</button>
                  <button id="slide-fullscreen" class="btn-primary" style="margin-left: 20px; cursor: pointer; background: #64748b;" title="Pantalla Completa">⛶</button>
                  <button id="slide-download" class="btn-primary" style="margin-left: 10px; cursor: pointer; background: #10b981;" title="Descargar como ZIP">⬇ Descargar</button>
                `;
                
                navContainer.style.textAlign = 'center';
                navContainer.style.margin = '2rem 0';
                navContainer.style.padding = '1rem';
                navContainer.style.background = '#f8fafc';
                navContainer.style.borderRadius = '12px';
                
                const wrapper = document.createElement('div');
                wrapper.className = 'slideshow-wrapper';
                wrapper.style.background = '#ffffff';
                wrapper.style.padding = '1rem';
                wrapper.style.borderRadius = '12px';
                
                h1.insertAdjacentElement('afterend', wrapper);
                wrapper.appendChild(navContainer);
                
                images.forEach((img, index) => {
                  const p = img.closest('p');
                  if (p) {
                    const prev = p.previousElementSibling;
                    if (prev && prev.tagName === 'H2') {
                      wrapper.appendChild(prev);
                    }
                    wrapper.appendChild(p);
                  }
                });
                
                document.getElementById('slide-fullscreen').addEventListener('click', () => {
                  if (!document.fullscreenElement) {
                    wrapper.requestFullscreen().catch(e => console.error(e));
                  } else {
                    document.exitFullscreen();
                  }
                });
                
                document.addEventListener('fullscreenchange', () => {
                  wrapper.style.overflowY = document.fullscreenElement ? 'auto' : 'visible';
                  updateSlides();
                });
                
                document.getElementById('slide-download').addEventListener('click', async (e) => {
                  const btn = e.target;
                  const originalText = btn.innerHTML;
                  btn.disabled = true;
                  btn.innerHTML = '⏳ Preparando...';
                  btn.style.opacity = '0.7';
                  
                  try {
                    if (!window.JSZip) {
                      await new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                        script.onload = resolve;
                        script.onerror = reject;
                        document.head.appendChild(script);
                      });
                    }
                    
                    const zip = new window.JSZip();
                    
                    // Descargar imágenes
                    const imgPromises = images.map(async (img) => {
                      const url = new URL(img.src);
                      const filename = url.pathname.split('/').pop();
                      const response = await fetch(url.href);
                      const blob = await response.blob();
                      zip.file(filename, blob);
                    });
                    
                    // Descargar markdown
                    if (vm.route && vm.route.file) {
                      const mdResponse = await fetch(vm.route.file);
                      if (mdResponse.ok) {
                        const mdText = await mdResponse.text();
                        zip.file('README.md', mdText);
                      }
                    }
                    
                    await Promise.all(imgPromises);
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    
                    const downloadUrl = URL.createObjectURL(zipBlob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    let safeName = h1.textContent.replace('Diapositivas:', '').trim().replace(/[^a-z0-9]/gi, '_').toLowerCase();
                    a.download = (safeName || 'presentacion') + '.zip';
                    a.click();
                    URL.revokeObjectURL(downloadUrl);
                    
                  } catch (err) {
                    console.error('Error al descargar ZIP:', err);
                    alert('Hubo un error al preparar la descarga.');
                  } finally {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                  }
                });
                
                function updateSlides() {
                  images.forEach((img, index) => {
                    const p = img.closest('p');
                    if (p) {
                      p.style.display = index === currentIndex ? 'block' : 'none';
                      p.style.textAlign = 'center';
                      
                      // Bulletproof against cached markdown or future errors:
                      // If the previous element is an h2 (the filename header), hide/show it too.
                      const prev = p.previousElementSibling;
                      if (prev && prev.tagName === 'H2') {
                        prev.style.display = index === currentIndex ? 'block' : 'none';
                        prev.style.textAlign = 'center';
                        prev.style.borderBottom = 'none';
                        prev.style.fontSize = '1.1rem';
                        prev.style.color = '#64748b';
                      }
                    }
                    if (index === currentIndex) {
                      img.style.maxHeight = document.fullscreenElement ? '85vh' : '70vh';
                      img.style.width = 'auto';
                      img.style.boxShadow = '0 10px 15px -3px rgba(0, 0, 0, 0.1)';
                      img.style.borderRadius = '8px';
                      img.style.border = '1px solid #e2e8f0';
                    }
                  });
                  document.getElementById('slide-counter').textContent = `${currentIndex + 1} / ${images.length}`;
                  
                  const prevBtn = document.getElementById('slide-prev');
                  const nextBtn = document.getElementById('slide-next');
                  
                  prevBtn.disabled = currentIndex === 0;
                  prevBtn.style.opacity = currentIndex === 0 ? '0.5' : '1';
                  prevBtn.style.cursor = currentIndex === 0 ? 'not-allowed' : 'pointer';
                  
                  nextBtn.disabled = currentIndex === images.length - 1;
                  nextBtn.style.opacity = currentIndex === images.length - 1 ? '0.5' : '1';
                  nextBtn.style.cursor = currentIndex === images.length - 1 ? 'not-allowed' : 'pointer';
                }
                
                document.getElementById('slide-prev').addEventListener('click', () => {
                  if (currentIndex > 0) { currentIndex--; updateSlides(); }
                });
                
                document.getElementById('slide-next').addEventListener('click', () => {
                  if (currentIndex < images.length - 1) { currentIndex++; updateSlides(); }
                });
                
                window.slideshowKeydownHandler = (e) => {
                  if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    currentIndex--; updateSlides();
                  } else if (e.key === 'ArrowRight' && currentIndex < images.length - 1) {
                    currentIndex++; updateSlides();
                  }
                };
                document.addEventListener('keydown', window.slideshowKeydownHandler);
                
                updateSlides();
              }
            }
          });
        },
        function(hook, vm) {
          hook.doneEach(function() {
            // Añadir botones de descarga en apuntes (anotaciones)
            if (vm.route && vm.route.file && vm.route.file.includes('anotaciones/')) {
              const content = document.querySelector('.markdown-section');
              if (!content) return;
              
              const h1 = content.querySelector('h1');
              if (h1) {
                const btnContainer = document.createElement('div');
                btnContainer.style.marginTop = '-10px';
                btnContainer.style.marginBottom = '30px';
                btnContainer.style.display = 'flex';
                btnContainer.style.gap = '10px';
                
                const mdBtn = document.createElement('button');
                mdBtn.className = 'btn-primary';
                mdBtn.style.padding = '6px 12px';
                mdBtn.style.fontSize = '14px';
                mdBtn.style.background = '#10b981';
                mdBtn.innerHTML = '⬇ Descargar Markdown';
                
                mdBtn.addEventListener('click', async () => {
                  try {
                    const res = await fetch(vm.route.file);
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = vm.route.file.split('/').pop();
                    a.click();
                    URL.revokeObjectURL(url);
                  } catch (e) {
                    console.error('Error downloading MD:', e);
                  }
                });
                
                const pdfBtn = document.createElement('button');
                pdfBtn.className = 'btn-primary';
                pdfBtn.style.padding = '6px 12px';
                pdfBtn.style.fontSize = '14px';
                pdfBtn.style.background = '#6366f1';
                pdfBtn.innerHTML = '🖨 Guardar como PDF';
                
                pdfBtn.addEventListener('click', async (e) => {
                  const btn = e.target;
                  const originalText = btn.innerHTML;
                  btn.disabled = true;
                  btn.innerHTML = '⏳ Generando PDF...';
                  btn.style.opacity = '0.7';
                  
                  try {
                    if (!window.html2pdf) {
                      await new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
                        script.onload = resolve;
                        script.onerror = reject;
                        document.head.appendChild(script);
                      });
                    }
                    
                    // Clonar el contenido para no modificar el DOM visible
                    const clone = content.cloneNode(true);
                    
                    // Eliminar la zona de botones del clon
                    const buttonsToRemove = clone.querySelector('div[style*="display: flex"]');
                    if (buttonsToRemove) buttonsToRemove.remove();
                    
                    // Arreglar gráficos Mermaid para el PDF
                    const mermaids = clone.querySelectorAll('.mermaid svg');
                    mermaids.forEach(svg => {
                      svg.style.maxWidth = '100%';
                      svg.style.height = 'auto';
                      // Quitar anchos explícitos fijos que rompen el canvas
                      svg.removeAttribute('width'); 
                      svg.removeAttribute('height');
                    });
                    
                    const opt = {
                      margin:       15,
                      filename:     vm.route.file.split('/').pop().replace('.md', '.pdf'),
                      image:        { type: 'jpeg', quality: 0.98 },
                      html2canvas:  { scale: 2, useCORS: true },
                      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };
                    
                    await window.html2pdf().set(opt).from(clone).save();
                  } catch (err) {
                    console.error('Error al generar PDF:', err);
                    alert('Hubo un error al generar el PDF.');
                  } finally {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                  }
                });
                
                btnContainer.appendChild(mdBtn);
                btnContainer.appendChild(pdfBtn);
                h1.insertAdjacentElement('afterend', btnContainer);
              }
            }
          });
        },
        function(hook, vm) {
          hook.doneEach(function() {
            // Sidebar manual collapse logic (reemplaza al plugin docsify-sidebar-collapse)
            const sidebarNav = document.querySelector('.sidebar-nav');
            if (sidebarNav) {
              const folders = sidebarNav.querySelectorAll('li:has(> ul)');
              folders.forEach(folder => {
                if (folder.dataset.collapsible) return;
                folder.dataset.collapsible = 'true';
                
                const link = folder.querySelector('a') || folder.querySelector('p');
                if (link) {
                  // Hide docsify-themeable default chevron bullet for this folder
                  link.style.setProperty('--sidebar-nav-link-before-content', 'none'); 
                  // Docsify-themeable usually uses background-image or content for ::before
                  link.classList.add('folder-link');
                  
                  const arrow = document.createElement('span');
                  arrow.innerHTML = '▼';
                  arrow.style.fontSize = '10px';
                  arrow.style.transition = 'transform 0.2s';
                  arrow.style.display = 'inline-block';
                  arrow.style.marginRight = '8px';
                  arrow.style.color = 'var(--theme-color)';
                  
                  link.insertBefore(arrow, link.firstChild);
                  
                  const toggleFolder = () => {
                    folder.classList.toggle('collapsed');
                    const ul = folder.querySelector('ul');
                    if (ul) {
                      const isCollapsed = folder.classList.contains('collapsed');
                      ul.style.display = isCollapsed ? 'none' : 'block';
                      arrow.style.transform = isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)';
                    }
                  };
                  
                  // Toggle on click
                  link.addEventListener('click', (e) => {
                    if (e.target === arrow || link.tagName === 'P') {
                       e.preventDefault();
                    }
                    toggleFolder();
                  });
                  
                  // Auto collapse if not active
                  setTimeout(() => {
                    const hasActive = folder.querySelector('.active');
                    if (!hasActive) {
                       folder.classList.add('collapsed');
                       const ul = folder.querySelector('ul');
                       if (ul) ul.style.display = 'none';
                       arrow.style.transform = 'rotate(-90deg)';
                    }
                  }, 50);
                }
              });
            }
          });
        }
      ]
    }
  </script>
  
  <!-- Core Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Themeable Plugin (DEBE IR JUSTO DESPUÉS DE DOCSIFY) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="https://unpkg.com/docsify-copy-code@2"></script>
  <script src="https://unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Mermaid -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ 
      startOnLoad: false, 
      theme: "base", 
      themeVariables: { 
        primaryColor: "#f8fafc", 
        primaryBorderColor: "#e2e8f0", 
        primaryTextColor: "#0f172a", 
        lineColor: "#4f46e5" 
      } 
    });
    window.mermaid = mermaid;
  </script>
</body>
</html>
