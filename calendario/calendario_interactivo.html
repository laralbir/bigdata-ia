            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay,listMonth'
                },
                // Al no definir 'initialDate', por defecto carga el día de HOY.
                navLinks: true, 
                businessHours: true, 
                editable: false,
                selectable: true,
                events: eventsData,
                eventDidMount: function(info) {
                    var today = new Date();
                    // Si la clase ya ha comenzado/terminado
                    if (info.event.start < today) {
                        info.el.classList.add('past-event');
                        info.el.title = "Clase impartida - Clic para acceder al material";
                    } else {
                        info.el.title = "Clase programada";
                    }
                },
                eventClick: function(info) {
                    var today = new Date();
                    if (info.event.start < today) {
                        var go = confirm('Esta clase ya se ha impartido.\nAsignatura: ' + info.event.title + '\n\n¿Deseas ir al repositorio para ver las grabaciones, presentaciones y material?');
                        if(go) {
                            window.open(info.event.extendedProps.folder_url, '_blank');
                        }
                    } else {
                        alert('Asignatura: ' + info.event.title + '\n' +
                              'Horario: ' + info.event.start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ' - ' + info.event.end.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + '\n' +
                              'Detalles: ' + info.event.extendedProps.description + '\n\n' +
                              '(El material estará disponible después de la clase)');
                    }
                }
            });

            calendar.render();
        });
